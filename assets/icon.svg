<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#3a1218"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#fa5252"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c0fc"/>
      <stop offset="1" stop-color="#1971c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4dabf7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4dabf7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="88" fill="url(#bg)"/>
  <rect width="400" height="400" rx="88" fill="url(#glow)"/>
  <!-- compass ring with tick marks -->
  <circle cx="200" cy="200" r="128" fill="none" stroke="url(#ring)" stroke-width="16"/>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round">
    <line x1="200" y1="92" x2="200" y2="108"/>
    <line x1="200" y1="292" x2="200" y2="308"/>
    <line x1="92" y1="200" x2="108" y2="200"/>
    <line x1="292" y1="200" x2="308" y2="200"/>
  </g>
  <!-- needle, tilted like the sidebar compass -->
  <g transform="rotate(40 200 200)">
    <path d="M200 98 L232 200 L168 200 Z" fill="url(#north)"/>
    <path d="M200 302 L232 200 L168 200 Z" fill="#e9ecef"/>
    <circle cx="200" cy="200" r="15" fill="#1b2a4a" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
