<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1729"/>
      <stop offset="1" stop-color="#2a0d12"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4dabf7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4dabf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fa5252" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fa5252" stop-opacity="0"/>
    </radialGradient>
    <!-- icon -->
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#3a1218"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#fa5252"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c0fc"/>
      <stop offset="1" stop-color="#1971c2"/>
    </linearGradient>
    <!-- tile "artworks" -->
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff922b"/><stop offset="0.55" stop-color="#e64980"/><stop offset="1" stop-color="#c92a2a"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20c997"/><stop offset="1" stop-color="#1864ab"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74c0fc"/><stop offset="1" stop-color="#364fc7"/></linearGradient>
    <linearGradient id="t4" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd43b"/><stop offset="1" stop-color="#f76707"/></linearGradient>
    <linearGradient id="t5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8787"/><stop offset="1" stop-color="#e03131"/></linearGradient>
    <linearGradient id="t6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3bc9db"/><stop offset="1" stop-color="#0b7285"/></linearGradient>
    <linearGradient id="t7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8787"/><stop offset="1" stop-color="#a61e4d"/></linearGradient>
    <linearGradient id="t8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94d82d"/><stop offset="1" stop-color="#2b8a3e"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.7" stop-color="#16161c" stop-opacity="0"/><stop offset="1" stop-color="#16161c" stop-opacity="1"/></linearGradient>
    <clipPath id="panelClip"><rect x="1080" y="70" width="500" height="580" rx="22"/></clipPath>
  </defs>

  <rect width="1680" height="720" fill="url(#bg)"/>
  <circle cx="300" cy="180" r="420" fill="url(#glowA)"/>
  <circle cx="1350" cy="560" r="480" fill="url(#glowB)"/>

  <!-- icon -->
  <g transform="translate(110 96) scale(0.5)">
    <rect width="400" height="400" rx="88" fill="url(#ibg)"/>
    <circle cx="200" cy="200" r="128" fill="none" stroke="url(#ring)" stroke-width="16"/>
    <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round">
      <line x1="200" y1="92" x2="200" y2="108"/><line x1="200" y1="292" x2="200" y2="308"/>
      <line x1="92" y1="200" x2="108" y2="200"/><line x1="292" y1="200" x2="308" y2="200"/>
    </g>
    <g transform="rotate(40 200 200)">
      <path d="M200 98 L232 200 L168 200 Z" fill="url(#north)"/>
      <path d="M200 302 L232 200 L168 200 Z" fill="#e9ecef"/>
      <circle cx="200" cy="200" r="15" fill="#1b2a4a" stroke="#ffffff" stroke-width="6"/>
    </g>
  </g>

  <!-- title -->
  <text x="106" y="410" font-family="Inter" font-weight="800" font-size="92" fill="#ffffff" letter-spacing="-1.5">Civitai Discovery</text>
  <text x="110" y="470" font-family="Inter" font-weight="500" font-size="32" fill="#adb5bd">Browse, search and recreate Civitai images</text>
  <text x="110" y="512" font-family="Inter" font-weight="500" font-size="32" fill="#adb5bd">right inside ComfyUI.</text>

  <!-- feature chips -->
  <g font-family="Inter" font-weight="600" font-size="22" fill="#e9ecef">
    <rect x="110" y="560" width="209" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="134" y="590">Discovery feed</text>
    <rect x="333" y="560" width="288" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="357" y="590">Favorites &amp; collections</text>
    <rect x="635" y="560" width="246" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="659" y="590">One-click prompts</text>
    <rect x="110" y="620" width="272" height="46" rx="23" fill="#4dabf7" fill-opacity="0.18" stroke="#4dabf7" stroke-opacity="0.55"/>
    <text x="134" y="650">Recreate in workflow</text>
    <rect x="396" y="620" width="237" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="420" y="650">Model downloads</text>
  </g>

  <!-- mock sidebar panel -->
  <rect x="1088" y="80" width="500" height="580" rx="22" fill="#000000" fill-opacity="0.35"/>
  <rect x="1080" y="70" width="500" height="580" rx="22" fill="#16161c" stroke="#ffffff" stroke-opacity="0.1"/>
  <g clip-path="url(#panelClip)">
    <!-- header -->
    <circle cx="1112" cy="104" r="9" fill="none" stroke="#adb5bd" stroke-width="2.5"/>
    <path d="M1116.5 99.5 L1113.5 105.5 L1107.5 108.5 L1110.5 102.5 Z" fill="#adb5bd"/>
    <text x="1130" y="111" font-family="Inter" font-weight="700" font-size="18" fill="#e9ecef" letter-spacing="0.6">CIVITAI DISCOVERY</text>
    <rect x="1102" y="130" width="456" height="36" rx="8" fill="#25252d" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="1116" y="154" font-family="Inter" font-size="16" fill="#868e96">#owl  @user  misty forest</text>
    <!-- masonry: 3 columns, x = 1102 / 1257 / 1412, width 146 -->
    <rect x="1102" y="180" width="146" height="196" rx="10" fill="url(#t1)"/>
    <rect x="1102" y="386" width="146" height="120" rx="10" fill="url(#t6)"/>
    <rect x="1102" y="516" width="146" height="170" rx="10" fill="url(#t5)"/>
    <rect x="1257" y="180" width="146" height="120" rx="10" fill="url(#t2)"/>
    <rect x="1257" y="310" width="146" height="210" rx="10" fill="url(#t4)"/>
    <rect x="1257" y="530" width="146" height="150" rx="10" fill="url(#t8)"/>
    <rect x="1412" y="180" width="146" height="160" rx="10" fill="url(#t3)"/>
    <rect x="1412" y="350" width="146" height="140" rx="10" fill="url(#t7)"/>
    <rect x="1412" y="500" width="146" height="190" rx="10" fill="url(#t1)"/>
    <!-- simple shapes as "subjects" -->
    <circle cx="1175" cy="250" r="34" fill="#ffffff" fill-opacity="0.85"/>
    <path d="M1102 376 L1150 316 L1185 350 L1215 300 L1248 376 Z" fill="#2a0d12" fill-opacity="0.55"/>
    <path d="M1257 520 L1300 440 L1340 480 L1403 400 L1403 520 Z" fill="#2a0d12" fill-opacity="0.45"/>
    <circle cx="1485" cy="410" r="26" fill="#ffffff" fill-opacity="0.7"/>
    <!-- badges / quick button -->
    <rect x="1110" y="188" width="54" height="22" rx="5" fill="#2b8a3e"/>
    <text x="1118" y="204" font-family="Inter" font-weight="700" font-size="13" fill="#ffffff">META</text>
    <rect x="1265" y="318" width="54" height="22" rx="5" fill="#2b8a3e"/>
    <text x="1273" y="334" font-family="Inter" font-weight="700" font-size="13" fill="#ffffff">META</text>
    <circle cx="1525" cy="210" r="20" fill="#228be6"/>
    <path d="M1522 200.5 a1.2 1.2 0 0 1 2-0.8 l9.2 9 a1.3 1.3 0 0 1 0 1.9 l-9.2 9.1 a1.2 1.2 0 0 1-2-0.8 v-4.8 c-6.1 0-10.1 1.6-12.8 5.6 a0.8 0.8 0 0 1-1.5-0.5 c1-7.8 5.9-12.6 14.3-13.1 z" fill="#ffffff"/>
    <rect x="1080" y="70" width="500" height="580" fill="url(#fade)"/>
  </g>
</svg>
